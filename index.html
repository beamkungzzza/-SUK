<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>SUKHOTHAI 2569 — ระบบตรวจรายการลงทะเบียน</title>

  <meta property="og:type" content="website" />
  <meta property="og:title" content="คณะสีสุโขทัย (สีชมพู) — ตรวจสอบรายชื่อ 2569" />
  <meta property="og:description" content="ระบบค้นหาและตรวจสอบรายชื่อนักกีฬา กิจกรรม และขบวนพาเหรด คณะสีสุโขทัย" />
  <meta property="og:url" content="https://sukhothai2569.vercel.app/" />
  <meta property="og:image" content="https://sukhothai2569.vercel.app/og-image.png" />
  <meta name="theme-color" content="#ec4899" />

  <link rel="preconnect" href="https://script.google.com" />
  <link rel="dns-prefetch" href="https://script.google.com" />

  <style>
    :root {
      --gas-banner-offset: 46px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #0b070a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Sarabun", sans-serif;
    }
    .frame-wrap {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }
    #appFrame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(100% + var(--gas-banner-offset));
      border: none;
      display: block;
    }
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: radial-gradient(circle at center, #1f0d1d 0%, #0b070a 100%);
      color: #fbcfe8;
      z-index: 999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    #loader.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(236, 72, 153, 0.2);
      border-top-color: #ec4899;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .direct-btn {
      margin-top: 12px;
      padding: 10px 18px;
      border-radius: 999px;
      background: linear-gradient(135deg, #ec4899, #d946ef);
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      display: none;
      box-shadow: 0 6px 18px rgba(236, 72, 153, 0.35);
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loader">
    <div class="spinner"></div>
    <div style="font-size: 15px; font-weight: 600;">กำลังเข้าสู่ระบบคณะสีสุโขทัย 2569...</div>
    <a id="directOpenBtn" class="direct-btn" href="https://script.google.com/macros/s/AKfycbznf9SKSn38dFDph-YXfavMfrEv1Pv5rNmRHNwpZ7IU-s8VP9JhB4lPpVMTSqv_4vH44A/exec">
      แตะที่นี่หากเปิดผ่าน Instagram แล้วหน้าจอค้าง
    </a>
  </div>

  <div class="frame-wrap">
    <iframe
      id="appFrame"
      src="https://script.google.com/macros/s/AKfycbznf9SKSn38dFDph-YXfavMfrEv1Pv5rNmRHNwpZ7IU-s8VP9JhB4lPpVMTSqv_4vH44A/exec"
      title="SUKHOTHAI 2569"
      allow="fullscreen; clipboard-write"
      allowfullscreen>
    </iframe>
  </div>

  <script>
    (function () {
      var GAS_URL = "https://script.google.com/macros/s/AKfycbznf9SKSn38dFDph-YXfavMfrEv1Pv5rNmRHNwpZ7IU-s8VP9JhB4lPpVMTSqv_4vH44A/exec";
      var iframe = document.getElementById('appFrame');
      var loader = document.getElementById('loader');
      var directBtn = document.getElementById('directOpenBtn');
      var ua = navigator.userAgent || '';

      // หากเปิดในแอป Instagram หรือ Facebook In-App Browser ที่บล็อก Cross-Site Iframe
      // ให้ส่งต่อไปยังหน้าเว็บแอปโดยตรงเพื่อไม่ให้ติดบล็อกคุกกี้ซ้อน 3 ชั้น
      if (/Instagram|FBAN|FBAV/i.test(ua)) {
        window.location.replace(GAS_URL);
        return;
      }

      function hideLoader() {
        loader.classList.add('fade-out');
      }

      iframe.addEventListener('load', hideLoader);
      // ซ่อนหน้าโหลดอัตโนมัติใน 4 วินาที ป้องกันอาการค้างหน้าโหลดบนมือถือบางรุ่น
      setTimeout(hideLoader, 4000);
      setTimeout(function () {
        if (directBtn) directBtn.style.display = 'inline-block';
      }, 2500);
    })();
  </script>
</body>
</html>
