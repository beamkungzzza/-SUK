<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SUK รายชื่อ</title>

<!-- SEO พื้นฐาน -->
<meta name="description" content="SUK รายชื่อ - ระบบค้นหาและตรวจสอบรายชื่อออนไลน์ สะดวก รวดเร็ว">

<!-- Favicon -->
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

<!-- Performance -->
<link rel="preconnect" href="https://script.google.com">
<link rel="dns-prefetch" href="https://script.google.com">

<style>
  :root {
    --gas-banner-offset: 46px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: #ffffff;
    font-family: "Segoe UI", "Sarabun", Tahoma, sans-serif;
  }

  .frame-wrap {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  #appFrame {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: calc(100% + var(--gas-banner-offset));
    border: none;
    display: block;
  }

  #loader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: #ffffff;
    z-index: 999;
    transition: opacity 0.5s ease;
    opacity: 1;
  }

  #loader.fade-out {
    opacity: 0;
    pointer-events: none;
  }

  .spinner {
    width: 44px;
    height: 44px;
    border: 4px solid #e0e0e0;
    border-top-color: #4285f4;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .loader-text {
    font-size: 15px;
    color: #555;
    letter-spacing: 0.3px;
  }

  #errorBox {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: #ffffff;
    z-index: 998;
    text-align: center;
    padding: 20px;
  }

  #errorBox p {
    font-size: 15px;
    color: #444;
    margin: 0;
  }

  #retryBtn {
    padding: 10px 24px;
    font-size: 15px;
    border: none;
    border-radius: 6px;
    background: #4285f4;
    color: #fff;
    cursor: pointer;
  }

  #retryBtn:hover {
    background: #3367d6;
  }

  noscript {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    padding: 20px;
    text-align: center;
    font-size: 16px;
    color: #333;
  }
</style>
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
    <div class="loader-text">กำลังโหลด SUK รายชื่อ...</div>
  </div>

  <div id="errorBox">
    <p>โหลดไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่</p>
    <button id="retryBtn">ลองอีกครั้ง</button>
  </div>

  <div class="frame-wrap">
    <iframe
      id="appFrame"
      src="https://script.google.com/macros/s/AKfycbznf9SKSn38dFDph-YXfavMfrEv1Pv5rNmRHNwpZ7IU-s8VP9JhB4lPpVMTSqv_4vH44A/exec"
      title="SUK รายชื่อ"
      allow="fullscreen"
      allowfullscreen
      scrolling="no">
    </iframe>
  </div>

  <noscript>
    กรุณาเปิดใช้งาน JavaScript เพื่อใช้งานแอปพลิเคชันนี้
  </noscript>

  <script>
    (function () {
      var iframe = document.getElementById('appFrame');
      var loader = document.getElementById('loader');
      var errorBox = document.getElementById('errorBox');
      var retryBtn = document.getElementById('retryBtn');
      var loaded = false;
      var timeoutId;

      function hideLoader() {
        if (loaded) return;
        loaded = true;
        clearTimeout(timeoutId);
        loader.classList.add('fade-out');
        setTimeout(function () {
          loader.style.display = 'none';
        }, 500);
      }

      function showError() {
        if (loaded) return;
        loader.style.display = 'none';
        errorBox.style.display = 'flex';
      }

      iframe.addEventListener('load', hideLoader);

      timeoutId = setTimeout(showError, 10000);

      retryBtn.addEventListener('click', function () {
        errorBox.style.display = 'none';
        loader.style.display = 'flex';
        loader.classList.remove('fade-out');
        loaded = false;
        iframe.src = iframe.src;
        timeoutId = setTimeout(showError, 10000);
      });
    })();
  </script>

</body>
</html>
