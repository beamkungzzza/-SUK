<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>คณะสีสุโขทัย (สีชมพู) - ระบบลงทะเบียนและตรวจสอบรายชื่อ</title>

  <!-- ข้อมูลสำหรับเวลาแชร์ลิงก์ลง LINE, Facebook, IG (Open Graph) -->
  <meta name="description" content="ระบบตรวจสอบรายชื่อกีฬา กิจกรรม และขบวนพาเหรด คณะสีสุโขทัย (สีชมพู) ประจำปีการศึกษา 2569" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="คณะสีสุโขทัย (สีชมพู) - ตรวจสอบรายชื่อ 2569" />
  <meta property="og:description" content="คลิกเพื่อเข้าสู่ระบบตรวจสอบรายชื่อนักกีฬา กิจกรรม และขบวนพาเหรด คณะสีสุโขทัย" />
  <meta property="og:image" content="https://img5.pic.in.th/file/secure-sv1/Sukhothai-Banner.png" />
  <meta name="theme-color" content="#ec4899" />

  <!-- Vercel Web Analytics (สำหรับนับจำนวนผู้เข้าชมเว็บ) -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d070b;
      font-family: 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* หน้าจอโหลดระหว่างรอเชื่อมต่อระบบหลังบ้าน (ลบวงกลมสีชมพูฉากหลังออก เหลือเฉพาะวงกลมหมุนได้) */
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0d070b;
      color: #ffffff;
      z-index: 10;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(236, 72, 153, 0.2);
      border-top-color: #ec4899;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 16px;
    }

    .loading-title {
      font-size: 16px;
      font-weight: 600;
      color: #fbcfe8;
      letter-spacing: 0.5px;
    }

    .loading-sub {
      font-size: 12px;
      color: rgba(251, 207, 232, 0.6);
      margin-top: 6px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Iframe แสดงผลเว็บแอปเต็มหน้าจอ 100% แบบไร้ขอบ */
    .iframe-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div id="loader">
    <div class="spinner"></div>
    <div class="loading-title">กำลังเชื่อมต่อระบบคณะสีสุโขทัย...</div>
    <div class="loading-sub">กรุณารอสักครู่</div>
  </div>

  <div class="iframe-container">
    <iframe
      id="appFrame"
      src="https://script.google.com/macros/s/AKfycbznf9SKSn38dFDph-YXfavMfrEv1Pv5rNmRHNwpZ7IU-s8VP9JhB4lPpVMTSqv_4vH44A/exec"
      title="คณะสีสุโขทัย 2569"
      allow="fullscreen; clipboard-write"
      allowfullscreen>
    </iframe>
  </div>

  <script>
    (function () {
      var iframe = document.getElementById('appFrame');
      var loader = document.getElementById('loader');
      function hideLoader() {
        loader.classList.add('hidden');
      }
      iframe.addEventListener('load', hideLoader);
      setTimeout(hideLoader, 3500);
    })();
  </script>
</body>
</html>
