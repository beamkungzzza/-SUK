<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SUK รายชื่อ</title>
<style>
  :root {
    /* ความสูงของแถบ "สร้างโดยผู้ใช้ Google Apps Script" ที่ต้องดันให้พ้นจอ
       ค่าปกติอยู่ที่ประมาณ 35-46px แล้วแต่ขนาดจอ ถ้ายังเห็นแถบโผล่มา
       ให้เพิ่มค่านี้ขึ้น เช่น 60px */
    --gas-banner-offset: 46px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100vh;   /* fallback สำหรับเบราว์เซอร์ที่ไม่รู้จัก dvh */
    height: 100dvh;
    overflow: hidden;
    background: #ffffff;
    font-family: "Segoe UI", "Sarabun", Tahoma, sans-serif;
  }

  /* กรอบนอกที่ตัดขอบ ไม่ให้เห็นส่วนเกินของ iframe (รวมถึงแถบ GAS) */
  .frame-wrap {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  /* iframe สูงกว่ากรอบจริง เพื่อดันแถบ GAS ให้พ้นพื้นที่มองเห็น */
  #appFrame {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: calc(100% + var(--gas-banner-offset));
    border: none;
    display: block;
  }

  /* ----- Loading Screen ----- */
  #loader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: #ffffff;
    z-index: 999;
    transition: opacity 0.5s ease;
    opacity: 1;
  }

  #loader.fade-out {
    opacity: 0;
    pointer-events: none;
  }

  .spinner {
    width: 44px;
    height: 44px;
    border: 4px solid #e0e0e0;
    border-top-color: #4285f4;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .loader-text {
    font-size: 15px;
    color: #555;
    letter-spacing: 0.3px;
  }

  noscript {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    padding: 20px;
    text-align: center;
    font-size: 16px;
    color: #333;
  }
</style>
</head>
<body>

  <!-- Loading screen -->
  <div id="loader">
    <div class="spinner"></div>
    <div class="loader-text">กำลังโหลด SUK รายชื่อ...</div>
  </div>

  <!-- กรอบตัดขอบ ซ่อนแถบ Google Apps Script -->
  <div class="frame-wrap">
    <iframe
      id="appFrame"
      src="https://script.google.com/macros/s/AKfycbznf9SKSn38dFDph-YXfavMfrEv1Pv5rNmRHNwpZ7IU-s8VP9JhB4lPpVMTSqv_4vH44A/exec"
      title="SUK รายชื่อ"
      allow="fullscreen"
      allowfullscreen
      scrolling="no">
    </iframe>
  </div>

  <noscript>
    กรุณาเปิดใช้งาน JavaScript เพื่อใช้งานแอปพลิเคชันนี้
  </noscript>

  <script>
    (function () {
      var iframe = document.getElementById('appFrame');
      var loader = document.getElementById('loader');
      var hidden = false;

      function hideLoader() {
        if (hidden) return;
        hidden = true;
        loader.classList.add('fade-out');
        setTimeout(function () {
          loader.style.display = 'none';
        }, 500);
      }

      iframe.addEventListener('load', hideLoader);

      // กันเคสที่ event load ไม่ยิง (บางเบราว์เซอร์/เครือข่ายช้า)
      setTimeout(hideLoader, 8000);
    })();
  </script>

</body>
</html>
